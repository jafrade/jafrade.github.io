<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preview image</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Jost:wght@300;400;500&display=block" rel="stylesheet">
<style>
  /* The 1200 × 630 image search results and link previews show. Render with tools/render-preview.sh. */
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #F5F0E7; color: #2A2724;
         font-family: "Jost", system-ui, sans-serif; display: grid; grid-template-columns: 1fr 300px; }
  .text { padding: 72px 64px 64px 80px; display: flex; flex-direction: column;
          background-image: radial-gradient(rgba(42,39,36,.075) 1px, transparent 1.1px); background-size: 14px 14px; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 500; }
  h1 { margin-top: auto; font-size: 84px; font-weight: 400; letter-spacing: -.01em; line-height: 1.05; }
  p { margin-top: 22px; font-size: 31px; font-weight: 300; line-height: 1.35; color: #625B53; max-width: 24em; }
  .label { margin-top: 40px; font-family: "IBM Plex Mono", monospace; font-size: 19px; font-weight: 500;
           letter-spacing: .08em; text-transform: uppercase; color: #86633F; }
  .fields { display: grid; grid-template-rows: 2fr 1fr 1.4fr 1fr; }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><svg width="44" height="44" viewBox="0 0 26 26"><circle cx="13" cy="13" r="13" fill="#2A2724"/><path d="M13 6a7 7 0 0 1 0 14z" fill="#B88B60"/></svg>Jason Frade</div>
    <h1>Senior product designer</h1>
    <p>Designing automation and AI agents that take repetitive work off small business teams.</p>
    <div class="label">jasonfrade.com</div>
  </div>
  <div class="fields"><div style="background:#B88B60"></div><div style="background:#7F8A74"></div><div style="background:#AFA091"></div><div style="background:#4B3E33"></div></div>
</body>
</html>
